name: coverage
# [test/DNM] not interested in this workflow on this branch.
on:
  workflow_dispatch:
permissions: {}

jobs:

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcovr libglib2.0-dev libsystemd-dev pkg-config bats socat
      - name: Run coverage
        run: |
          sudo mkdir -p /var/run/crio
          sudo make test-coverage

  all-done:
    needs:
      - coverage
    runs-on: ubuntu-latest
    steps:
      - run: echo "All jobs completed"
