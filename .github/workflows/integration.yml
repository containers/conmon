name: integration
on:
  push:
    tags:
      - v*
    branches:
      - main
  pull_request:
permissions: {}

# Cancel a PR's older runs when it is pushed to again. github.head_ref is set
# for pull_request events only, so pushes to main and tags fall back to the
# unique run_id and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:

  conmon:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # TODO: switch back to stable once cri-o vendors golang.org/x/net
          # v0.55.0 or newer; until then it does not build with go 1.27.
          # See https://github.com/cri-o/cri-o/pull/10103#issuecomment-5400108050
          go-version: '1.27'
          cache: false
      - run: hack/github-actions-setup
      - name: Run conmon integration tests
        run: |
          sudo mkdir -p /var/run/crio
          sudo make test-binary

  cri-o:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      # Let the other job finish: these two take about half an hour each, and
      # one of them failing is no reason to throw the other one's result away.
      fail-fast: false
      matrix:
        critest: [0, 1]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # TODO: switch back to stable once cri-o vendors golang.org/x/net
          # v0.55.0 or newer; until then it does not build with go 1.27.
          # See https://github.com/cri-o/cri-o/pull/10103#issuecomment-5400108050
          go-version: '1.27'
          cache: false
      - run: hack/github-actions-setup
      - name: Run CRI-O integration tests (critest=${{ matrix.critest }})
        run: |
          CRIO_DIR=$(go env GOPATH)/src/github.com/cri-o/cri-o
          make -C "$CRIO_DIR" all test-binaries
          # These test files do not exercise conmon, so skip them: that is
          # about a third of the suite's run time.
          skip=(
              # images, registries, and the artifacts served from them
              artifact_additional_stores
              cert
              image
              image_remove
              image_volume
              imagefsinfo
              inspecti
              namespaced_auth_dir
              oci_artifacts
              policy
              seccomp_oci_artifacts
              tls_config

              # security profiles: handled by cri-o and the runtime, not conmon
              apparmor
              seccomp_notifier
              seccomp_runtime_handler

              # cri-o's own configuration, status and storage
              annotation_migration
              crio-check
              crio-wipe
              inject_gomaxprocs
              profile
              reload_config
              reload_system
              status
              workloads

              # cri-o's metrics endpoints
              cri-metrics
              metrics

              # device and plugin plumbing
              cdi
              nri
          )
          for t in "${skip[@]}"; do
              # No -f: a file cri-o renames must fail the job, not be skipped.
              rm "$CRIO_DIR/test/$t.bats"
          done
          sudo sh -c "cd $CRIO_DIR; RUN_CRITEST=${{ matrix.critest }} ./test/test_runner.sh"

  all-done:
    needs:
      - conmon
      - cri-o
    runs-on: ubuntu-24.04
    steps:
    - run: echo "All jobs completed"
