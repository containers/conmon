name: static-binary
on:
  push:
    tags:
      - v*
  workflow_dispatch:
permissions: {}

jobs:

  static-binary:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: amd64
            target: default.nix
          - name: arm64
            target: default-arm64.nix
          - name: ppc64le
            target: default-ppc64le.nix
          - name: riscv64
            target: default-riscv64.nix
          - name: s390x
            target: default-s390x.nix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
      - name: Build static ${{ matrix.name }} binary
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          TARGET: ${{ matrix.target }}
        run: |
          podman run -i --rm \
            -e CACHIX_AUTH_TOKEN \
            -v "$PWD:$PWD:Z" \
            -w "$PWD" \
            docker.io/nixos/nix:2.15.0 \
            sh -c \
            "nix-env -iA cachix -f https://cachix.org/api/v1/install && \
             cachix use conmon && \
             nix-build nix/$TARGET && \
             nix-store -qR --include-outputs \$(nix-instantiate nix/$TARGET) | grep -v conmon | cachix push conmon && \
             cp -R result/bin ."
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conmon-${{ matrix.name }}
          path: bin/conmon

  upload:
    # Attach the binaries built above to the release for this tag, so that
    # cutting a release does not mean downloading five artifacts by hand.
    # Manual runs have no tag to attach to, hence the condition.
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - static-binary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      # This job does not check the repository out, so gh has no git remote
      # to infer the repository from and has to be told.
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: conmon-*
          path: artifacts
      - name: Rename the binaries after their architecture
        run: |
          mkdir assets
          for d in artifacts/conmon-*; do
              mv "$d/conmon" "assets/conmon.${d#artifacts/conmon-}"
          done
          ls -l assets
      - name: Upload the binaries to the ${{ github.ref_name }} release
        run: |
          # A release created from the web UI already exists by the time the
          # tag build finishes; a tag pushed on its own has none, so make a
          # draft for the release notes to be written into and published --
          # publishing is what triggers packit's downstream sync.
          gh release view "$TAG" >/dev/null ||
              gh release create "$TAG" --draft --title "$TAG" --generate-notes
          gh release upload "$TAG" assets/* --clobber

  all-done:
    needs:
      - static-binary
    runs-on: ubuntu-latest
    steps:
      - run: echo "All jobs completed"
